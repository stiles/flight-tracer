name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # tz extra is exercised by TestResolveTimezone; the faa extra
        # (hangarbay) isn't -- it needs a data download and no test calls it.
        pip install -e ".[tz]"
        pip install pytest pytest-cov setuptools
    - name: Run tests
      run: |
        pytest tests/ -v
    - name: Upload visual regression renders
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: visual-results-py${{ matrix.python-version }}
        path: tests/visual_results/
        if-no-files-found: ignore

  # Pixel baselines are only comparable within one matplotlib minor release,
  # so the matrix above skips them on other versions. This job always runs
  # them, against the exact version recorded when they were regenerated.
  visual:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[tz]"
        pip install pytest "matplotlib==$(cat tests/baseline_images/matplotlib-version.txt)"
    - name: Run visual regression tests
      env:
        FLIGHT_TRACER_REQUIRE_VISUAL: "1"
      run: |
        pytest tests/test_visual.py -v
    - name: Upload visual regression renders
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: visual-results
        path: tests/visual_results/
        if-no-files-found: ignore
